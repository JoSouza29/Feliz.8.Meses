<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz nosso dia — 8 meses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --vivid-red:   #e8203d;
  --hot-pink:    #ff5f8f;
  --light-pink:  #ffc2d6;
  --pale-pink:   #ffe9f0;
  --deep-wine:   #55081f;
  --gold:        #f3cf94;
  --cream:       #fff6f8;
}

*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  height:100%;
  width:100%;
  overflow:hidden;
  background:var(--deep-wine);
}

body{
  font-family:'Josefin Sans', Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}

.stage{
  position:relative;
  height:100%;
  width:100%;
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:radial-gradient(circle at 30% 22%, var(--hot-pink) 0%, var(--vivid-red) 45%, var(--deep-wine) 100%);
  background-size:220% 220%;
  animation:driftBg 16s ease-in-out infinite;
}

@keyframes driftBg{
  0%,100%{ background-position:28% 20%; }
  50%{ background-position:72% 78%; }
}

/* ---------- ambient rain: hearts + flowers, always behind everything ---------- */
.hearts{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.heart-particle{
  position:absolute;
  bottom:-10%;
  will-change:transform, opacity;
  animation-name:floatUp;
  animation-timing-function:ease-in;
  animation-iteration-count:infinite;
  text-shadow:0 0 12px rgba(255,255,255,0.25);
  opacity:0;
}
@keyframes floatUp{
  0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
  10%{ opacity:var(--o,0.55); }
  50%{ transform:translate(var(--sway,18px), -55vh) rotate(8deg); }
  90%{ opacity:var(--o,0.55); }
  100%{ transform:translate(calc(var(--sway,18px) * -1), -115vh) rotate(-6deg); opacity:0; }
}

/* ---------- content ---------- */
.content{
  position:relative;
  z-index:2;
  text-align:center;
  color:var(--cream);
  padding:0 6vw;
  width:100%;
}

.phrase{
  font-family:'Great Vibes', 'Brush Script MT', cursive;
  font-weight:400;
  font-size:clamp(2.4rem, 10vw, 5.5rem);
  line-height:1.25;
  color:var(--cream);
  text-shadow:0 4px 26px rgba(85,8,31,0.45);
  opacity:0;
  transform:scale(0.9);
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.phrase-text{
  display:inline-block;
  max-width:100%;
}
.cursor{
  display:inline-block;
  margin-left:0.06em;
  opacity:0;
}
.typing .cursor{
  opacity:1;
  animation:blink 0.9s steps(1) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

.phrase.enter{
  animation:phraseIn 0.7s cubic-bezier(.2,.8,.25,1) forwards;
}
.phrase.leave{
  animation:phraseOut 0.85s ease-in forwards;
}
@keyframes phraseIn{
  0%{ opacity:0; transform:scale(0.92) translateY(8px); }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}
@keyframes phraseOut{
  0%{ opacity:1; transform:scale(1); filter:blur(0); }
  100%{ opacity:0; transform:scale(1.08); filter:blur(6px); }
}

.milestone{
  position:relative;
  opacity:0;
  transform:scale(0.85);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.milestone.enter{
  animation:milestoneIn 1s cubic-bezier(.2,.8,.25,1) forwards;
}
@keyframes milestoneIn{
  0%{ opacity:0; transform:scale(0.82); }
  100%{ opacity:1; transform:scale(1); }
}

/* ---------- heart phase, centered ---------- */
.frame{
  position:relative;
  width:clamp(230px, 56vw, 380px);
  height:clamp(230px, 56vw, 380px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.frame.dissolve{
  animation:frameDissolve 0.9s ease-in forwards;
}
@keyframes frameDissolve{
  0%{ opacity:1; filter:blur(0px); transform:scale(1); }
  100%{ opacity:0; filter:blur(7px); transform:scale(0.86); }
}
.frame.hidden{
  display:none;
}

.heart-outline{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  overflow:visible;
}
.heart-outline path{
  fill:none;
  stroke:url(#heartGrad);
  stroke-width:1.4;
  stroke-linecap:round;
  transition:stroke-dashoffset 1.4s ease-out;
}

.numbers-layer{
  position:absolute;
  inset:0;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity 0.6s ease;
}
.numbers-layer.show{ opacity:1; }

.eyebrow{
  font-family:'Josefin Sans', Arial, sans-serif;
  font-size:clamp(0.8rem, 2.1vw, 1.15rem);
  letter-spacing:0.4em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:clamp(0.5rem, 1.6vw, 0.9rem);
}

.number{
  font-family:'Cormorant Garamond', Georgia, serif;
  font-weight:600;
  font-size:clamp(3.6rem, 15vw, 7.2rem);
  line-height:0.85;
  color:var(--cream);
  text-shadow:0 6px 34px rgba(85,8,31,0.5);
  animation:heartbeat 2.6s ease-in-out infinite;
}
@keyframes heartbeat{
  0%, 100%{ transform:scale(1); }
  10%{ transform:scale(1.05); }
  20%{ transform:scale(0.99); }
  30%{ transform:scale(1.02); }
  40%{ transform:scale(1); }
}

.label{
  font-family:'Josefin Sans', Arial, sans-serif;
  font-weight:500;
  font-size:clamp(0.68rem, 1.7vw, 0.9rem);
  letter-spacing:0.5em;
  text-transform:uppercase;
  color:var(--light-pink);
  margin-top:clamp(0.35rem, 1.4vw, 0.7rem);
  padding-left:0.5em;
}

/* ---------- photo phase — replaces the heart, same centered spot ---------- */
.photo-rain{
  display:none;
  position:relative;
  width:clamp(230px, 56vw, 380px);
  height:clamp(230px, 56vw, 380px);
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.photo-rain.active{
  display:flex;
}
.photo-card{
  --dx:0px;
  --rot:0deg;
  position:absolute;
  width:clamp(148px, 40vw, 208px);
  aspect-ratio:4/5;
  background:#fffdfb;
  padding:8px 8px 22px 8px;
  border-radius:7px;
  box-shadow:0 16px 34px rgba(30,4,14,0.45);
  opacity:0;
  transform:translate(var(--dx), -28px) rotate(var(--rot)) scale(0.9);
  transition:opacity 0.5s ease, transform 0.5s cubic-bezier(.2,.8,.25,1);
}
.photo-card.show{
  opacity:1;
  transform:translate(var(--dx), 0) rotate(var(--rot)) scale(1);
}
.photo-card.leave{
  opacity:0;
  transform:translate(var(--dx), 26px) rotate(var(--rot)) scale(0.94);
  transition:opacity 0.45s ease, transform 0.45s ease-in;
}
.photo-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  border-radius:2px;
  background:#eee;
}

/* ---------- final romantic scene ---------- */
.final-scene{
  display:none;
  position:relative;
  opacity:0;
  transition:opacity 0.6s ease;
  flex-direction:column;
  align-items:center;
  padding:clamp(1.2rem, 5vw, 2.2rem);
}
.final-scene.active{ display:flex; }
.final-scene.show{ opacity:1; }

.final-glow{
  position:absolute;
  left:50%;
  top:50%;
  width:140%;
  height:170%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(243,207,148,0.30) 0%, rgba(255,95,143,0.16) 45%, transparent 72%);
  filter:blur(18px);
  animation:glowPulse 4.2s ease-in-out infinite;
  z-index:-1;
  pointer-events:none;
}
@keyframes glowPulse{
  0%,100%{ opacity:0.65; transform:translate(-50%,-50%) scale(0.94); }
  50%{ opacity:1; transform:translate(-50%,-50%) scale(1.06); }
}

.final-heart-icon{
  font-size:clamp(1.15rem, 4vw, 1.7rem);
  color:var(--gold);
  margin-bottom:clamp(0.5rem, 2vw, 0.9rem);
  text-shadow:0 2px 12px rgba(85,8,31,0.5);
  animation:heartbeat 2.2s ease-in-out infinite;
}

.sparkle{
  position:absolute;
  color:var(--gold);
  font-size:clamp(0.85rem, 2.8vw, 1.2rem);
  opacity:0;
  animation:twinkle 2.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes twinkle{
  0%, 100%{ opacity:0; transform:scale(0.5) rotate(0deg); }
  50%{ opacity:1; transform:scale(1.05) rotate(12deg); }
}
.sp1{ top:-2%;  left:4%;   animation-delay:0s;    color:var(--light-pink); }
.sp2{ top:6%;   right:2%;  animation-delay:0.7s;  }
.sp3{ bottom:8%; left:-2%; animation-delay:1.4s;  }
.sp4{ bottom:-4%; right:8%; animation-delay:2.0s; color:var(--light-pink); }

.love-burst{
  position:absolute;
  left:50%;
  top:50%;
  font-size:1rem;
  pointer-events:none;
  will-change:transform, opacity;
}

.message-outside{
  position:relative;
  font-family:'Caveat', 'Segoe Script', cursive;
  font-weight:600;
  font-size:clamp(1.3rem, 5.2vw, 2.3rem);
  line-height:1.45;
  color:var(--cream);
  text-shadow:0 4px 20px rgba(85,8,31,0.45);
  max-width:84vw;
  text-align:center;
}

/* ---------- replay control ---------- */
.replay{
  position:absolute;
  bottom:clamp(1.2rem, 3.4vh, 2.2rem);
  left:50%;
  transform:translateX(-50%);
  z-index:3;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.35);
  color:var(--cream);
  font-family:'Josefin Sans', Arial, sans-serif;
  font-size:0.8rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  padding:0.65em 1.4em;
  border-radius:999px;
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  transition:opacity 0.6s ease, background 0.2s ease;
}
.replay.show{
  opacity:0.85;
  pointer-events:auto;
}
.replay:hover{
  background:rgba(255,255,255,0.22);
}

@media (prefers-reduced-motion: reduce){
  .stage{ animation:none; }
  .number{ animation:none; }
  .heart-particle{ animation:none; display:none; }
  .final-glow{ animation:none; }
  .sparkle{ animation:none; opacity:0.8; }
}
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <div class="content">
    <h1 class="phrase" id="phrase">
      <span class="phrase-text" id="phraseText"></span><span class="cursor" id="phraseCursor">|</span>
    </h1>

    <div class="milestone" id="milestone">

      <div class="frame" id="frame">
        <svg class="heart-outline" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f3cf94"/>
              <stop offset="55%" stop-color="#ffc2d6"/>
              <stop offset="100%" stop-color="#ff5f8f"/>
            </linearGradient>
          </defs>
          <path id="heartPath" d="M50,88 C22,68 6,50 6,32 C6,17 17,7 31,7 C40,7 47,12 50,20 C53,12 60,7 69,7 C83,7 94,17 94,32 C94,50 78,68 50,88 Z"/>
        </svg>

        <div class="numbers-layer" id="numbersLayer">
          <div class="eyebrow">juntos há</div>
          <div class="number">8</div>
          <div class="label">meses</div>
        </div>
      </div>

      <div class="photo-rain" id="photoRain" aria-hidden="true"></div>

      <div class="final-scene" id="finalScene">
        <div class="final-glow" aria-hidden="true"></div>
        <div class="final-heart-icon" aria-hidden="true">&#9829;</div>
        <div class="message-outside" id="messageOutside">
          <span id="loveText"></span><span class="cursor" id="loveCursor">|</span>
        </div>
        <span class="sparkle sp1" aria-hidden="true">&#10022;</span>
        <span class="sparkle sp2" aria-hidden="true">&#10023;</span>
        <span class="sparkle sp3" aria-hidden="true">&#10022;</span>
        <span class="sparkle sp4" aria-hidden="true">&#10023;</span>
      </div>

    </div>
  </div>

  <button class="replay" id="replay" type="button">&#8635; ver de novo</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  try {
    var phrase = document.getElementById('phrase');
    var phraseText = document.getElementById('phraseText');
    var milestone = document.getElementById('milestone');
    var frame = document.getElementById('frame');
    var numbersLayer = document.getElementById('numbersLayer');
    var photoRain = document.getElementById('photoRain');
    var finalScene = document.getElementById('finalScene');
    var messageOutside = document.getElementById('messageOutside');
    var loveText = document.getElementById('loveText');
    var replayBtn = document.getElementById('replay');
    var heartsWrap = document.getElementById('hearts');
    var heartPath = document.getElementById('heartPath');

    var PHRASE = 'Feliz nosso dia';
    var MESSAGE = 'Eu te amo Yasmin, com minha alma e meu coração, feliz nosso dia!';

    var PHOTOS = [
      { src: 'https://i.ibb.co/wrCQs5T6/20251206-201620.jpg', alt: 'lembrança 1' },
      { src: 'https://i.ibb.co/CKKY1f2L/IMG-20250518-162228-374.webp', alt: 'lembrança 2' },
      { src: 'https://i.ibb.co/FkVxWMzh/IMG-20250518-163935-566.webp', alt: 'lembrança 3' },
      { src: 'https://i.ibb.co/S4TD8ssf/IMG-20260329-WA0055.jpg', alt: 'lembrança 4' },
      { src: 'https://i.ibb.co/V0Fht1nX/IMG-20260612-WA0009.jpg', alt: 'lembrança 5' },
      { src: 'https://i.ibb.co/DHM7mxMv/IMG-20260612-WA0010.jpg', alt: 'lembrança 6' },
      { src: 'https://i.ibb.co/twnBXw83/IMG-20260612-WA0012.jpg', alt: 'lembrança 7' }
    ];

    if (!phrase || !phraseText || !milestone || !frame || !numbersLayer || !photoRain || !finalScene || !messageOutside || !loveText || !replayBtn || !heartsWrap || !heartPath) {
      throw new Error('elemento essencial nao encontrado');
    }

    // measure the heart path once, so the line-draw effect works
    // reliably across browsers (no dependency on SVG2 pathLength support)
    var heartLen = heartPath.getTotalLength ? heartPath.getTotalLength() : 300;
    heartPath.style.strokeDasharray = heartLen;
    heartPath.style.strokeDashoffset = heartLen;

    var timers = [];
    function clearTimers() { for (var t = 0; t < timers.length; t++) { clearTimeout(timers[t]); } timers = []; }
    function after(ms, fn) { timers.push(setTimeout(fn, ms)); }

    // ambient rain of hearts + flowers, behind everything, runs the whole time
    function spawnHearts() {
      heartsWrap.innerHTML = '';
      var symbols = ['\u2665', '\uD83C\uDF38', '\u2665', '\uD83C\uDF37', '\u2665', '\uD83C\uDF3A'];
      var colors = ['#ffc2d6', '#fff6f8', '#f3cf94', '#ff8fae'];
      var count = 24;
      for (var i = 0; i < count; i++) {
        var h = document.createElement('span');
        h.className = 'heart-particle';
        var sym = symbols[i % symbols.length];
        h.textContent = sym;
        var size = (Math.random() * 1.1 + 0.6).toFixed(2);
        var left = (Math.random() * 100).toFixed(1);
        var duration = (Math.random() * 9 + 9).toFixed(1);
        var delay = (Math.random() * 14).toFixed(1);
        var sway = (Math.random() * 40 + 10).toFixed(0);
        var opacity = (Math.random() * 0.35 + 0.25).toFixed(2);
        h.style.left = left + 'vw';
        h.style.fontSize = size + 'rem';
        if (sym === '\u2665') { h.style.color = colors[i % colors.length]; }
        h.style.animationDuration = duration + 's';
        h.style.animationDelay = delay + 's';
        h.style.setProperty('--sway', sway + 'px');
        h.style.setProperty('--o', opacity);
        heartsWrap.appendChild(h);
      }
    }

    function typeWriter(el, text, speed, onDone) {
      el.textContent = '';
      var i = 0;
      function step() {
        if (i <= text.length) {
          el.textContent = text.slice(0, i);
          i++;
          after(speed, step);
        } else if (onDone) {
          onDone();
        }
      }
      step();
    }

    function drawHeart() {
      heartPath.style.transition = 'stroke-dashoffset 1.4s ease-out';
      heartPath.style.strokeDashoffset = '0';
    }

    function undrawHeart() {
      heartPath.style.transition = 'stroke-dashoffset 0.9s ease-in';
      heartPath.style.strokeDashoffset = String(heartLen);
    }

    // ---------- photo rain: memories dropping in, one by one, in the heart's place ----------
    var photoCards = [];
    function spawnPhotoCards() {
      photoRain.innerHTML = '';
      photoCards = [];
      for (var i = 0; i < PHOTOS.length; i++) {
        var card = document.createElement('div');
        card.className = 'photo-card';
        var dx = (Math.random() * 26 - 13).toFixed(0);
        var rot = (Math.random() * 12 - 6).toFixed(1);
        card.style.setProperty('--dx', dx + 'px');
        card.style.setProperty('--rot', rot + 'deg');
        var img = document.createElement('img');
        img.src = PHOTOS[i].src;
        img.alt = PHOTOS[i].alt;
        img.loading = 'eager';
        img.decoding = 'async';
        card.appendChild(img);
        photoRain.appendChild(card);
        photoCards.push(card);
      }
    }

    function runPhotoRain(onAllDone) {
      var HOLD = 950;
      var GAP = 150;
      function showPhoto(i) {
        if (i >= photoCards.length) { onAllDone(); return; }
        var card = photoCards[i];
        card.classList.add('show');
        after(HOLD, function () {
          card.classList.remove('show');
          card.classList.add('leave');
          after(450, function () {
            after(GAP, function () { showPhoto(i + 1); });
          });
        });
      }
      showPhoto(0);
    }

    // ---------- little heart burst for the final scene ----------
    function burstHearts(container) {
      var count = 12;
      var colors = ['#ffc2d6', '#fff6f8', '#f3cf94'];
      for (var i = 0; i < count; i++) {
        (function () {
          var s = document.createElement('span');
          s.className = 'love-burst';
          s.textContent = '\u2665';
          var angle = Math.random() * Math.PI * 2;
          var dist = 60 + Math.random() * 90;
          var dx = Math.cos(angle) * dist;
          var dy = Math.sin(angle) * dist;
          var size = (0.7 + Math.random() * 0.9).toFixed(2);
          s.style.fontSize = size + 'rem';
          s.style.color = colors[i % colors.length];
          container.appendChild(s);
          if (s.animate) {
            var anim = s.animate([
              { transform: 'translate(-50%,-50%) scale(0.4)', opacity: 1 },
              { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(1)', opacity: 0 }
            ], { duration: 1300 + Math.random() * 500, delay: Math.random() * 200, easing: 'ease-out', fill: 'forwards' });
            anim.onfinish = function () { s.remove(); };
          } else {
            after(1800, function () { s.remove(); });
          }
        })();
      }
    }

    function runSequence() {
      clearTimers();
      spawnHearts();
      spawnPhotoCards();

      phrase.classList.remove('enter', 'leave', 'typing');
      milestone.classList.remove('enter');
      frame.classList.remove('dissolve', 'hidden');
      numbersLayer.classList.remove('show');
      photoRain.classList.remove('active');
      finalScene.classList.remove('active', 'show');
      replayBtn.classList.remove('show');
      phraseText.textContent = '';
      loveText.textContent = '';
      heartPath.style.transition = 'none';
      heartPath.style.strokeDashoffset = String(heartLen);
      void phrase.offsetWidth;

      // 1. phrase fades in, types itself out, holds briefly
      phrase.classList.add('enter');
      phrase.classList.add('typing');

      after(500, function () {
        typeWriter(phraseText, PHRASE, 85, function () {
          after(2200, function () {
            phrase.classList.remove('typing');
            phrase.classList.remove('enter');
            phrase.classList.add('leave');

            after(300, function () {
              // 2. heart forms, centered, and holds "juntos há 8 meses" alone for a while
              milestone.classList.add('enter');
              after(150, drawHeart);
              after(400, function () { numbersLayer.classList.add('show'); });

              after(3800, function () {
                // 3. the heart dissolves completely before the photos appear
                frame.classList.add('dissolve');
                numbersLayer.classList.remove('show');
                undrawHeart();

                after(900, function () {
                  frame.classList.add('hidden');

                  // 4. the photos take the heart's place, one by one
                  photoRain.classList.add('active');
                  runPhotoRain(function () {
                    photoRain.classList.remove('active');

                    // 5. the final, more romantic message screen
                    after(200, function () {
                      finalScene.classList.add('active');
                      after(30, function () { finalScene.classList.add('show'); });
                      burstHearts(finalScene);
                      typeWriter(loveText, MESSAGE, 55, function () {
                        after(600, function () { replayBtn.classList.add('show'); });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    }

    replayBtn.addEventListener('click', runSequence);
    runSequence();

  } catch (err) {
    // fallback: if anything goes wrong, always show the content statically
    // instead of leaving a blank screen
    console.error('Falha na animacao, mostrando versao estatica:', err);
    var p = document.getElementById('phraseText');
    var ph = document.getElementById('phrase');
    var ms = document.getElementById('milestone');
