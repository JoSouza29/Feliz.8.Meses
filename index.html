<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz nosso dia — 8 meses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --vivid-red:   #e8203d;
  --hot-pink:    #ff5f8f;
  --light-pink:  #ffc2d6;
  --pale-pink:   #ffe9f0;
  --deep-wine:   #55081f;
  --gold:        #f3cf94;
  --cream:       #fff6f8;
  --ink:         #5c1a2e;
}

*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  min-height:100%;
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  overflow-x:hidden;
  overflow-y:auto;
  background:var(--deep-wine);
}

body{
  font-family:'Josefin Sans', Arial, sans-serif;
  -webkit-font-smoothing:antialiased;
}

.stage{
  position:relative;
  width:100%;
  min-height:100%;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:radial-gradient(circle at 30% 22%, var(--hot-pink) 0%, var(--vivid-red) 45%, var(--deep-wine) 100%);
  background-size:220% 220%;
  animation:driftBg 16s ease-in-out infinite;
}
.stage.shake{ animation:driftBg 16s ease-in-out infinite, impactShake 0.4s ease; }

@keyframes driftBg{
  0%,100%{ background-position:28% 20%; }
  50%{ background-position:72% 78%; }
}
@keyframes impactShake{
  0%,100%{ transform:translate(0,0); }
  20%{ transform:translate(-5px,3px); }
  40%{ transform:translate(5px,-3px); }
  60%{ transform:translate(-4px,2px); }
  80%{ transform:translate(4px,-1px); }
}

/* ---------- ambient rain: hearts + flowers, always behind everything ---------- */
.hearts{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.heart-particle{
  position:absolute;
  bottom:-10%;
  will-change:transform, opacity;
  animation-name:floatUp;
  animation-timing-function:ease-in;
  animation-iteration-count:infinite;
  text-shadow:0 0 12px rgba(255,255,255,0.25);
  opacity:0;
}
@keyframes floatUp{
  0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
  10%{ opacity:var(--o,0.55); }
  50%{ transform:translate(var(--sway,18px), -55vh) rotate(8deg); }
  90%{ opacity:var(--o,0.55); }
  100%{ transform:translate(calc(var(--sway,18px) * -1), -115vh) rotate(-6deg); opacity:0; }
}

/* ---------- content ---------- */
.content{
  position:relative;
  z-index:2;
  text-align:center;
  color:var(--cream);
  padding:0 6vw;
  width:100%;
}

.phrase{
  font-family:'Great Vibes', 'Brush Script MT', cursive;
  font-weight:400;
  font-size:clamp(2.4rem, 10vw, 5.5rem);
  line-height:1.25;
  color:var(--cream);
  text-shadow:0 4px 26px rgba(85,8,31,0.45);
  opacity:0;
  transform:scale(0.9);
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.phrase-text{
  display:inline-block;
  max-width:100%;
}
.cursor{
  display:inline-block;
  margin-left:0.06em;
  opacity:0;
}
.typing .cursor{
  opacity:1;
  animation:blink 0.9s steps(1) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

.phrase.enter{
  animation:phraseIn 0.6s cubic-bezier(.2,.8,.25,1) forwards;
}
.phrase.leave{
  animation:phraseOut 0.65s ease-in forwards;
}
@keyframes phraseIn{
  0%{ opacity:0; transform:scale(0.92) translateY(8px); }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}
@keyframes phraseOut{
  0%{ opacity:1; transform:scale(1); filter:blur(0); }
  100%{ opacity:0; transform:scale(1.08); filter:blur(6px); }
}

.milestone{
  position:relative;
  opacity:0;
  transform:scale(0.85);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(0.4rem, 1.8vh, 0.9rem);
}
.milestone.enter{
  animation:milestoneIn 1s cubic-bezier(.2,.8,.25,1) forwards;
}
@keyframes milestoneIn{
  0%{ opacity:0; transform:scale(0.82); }
  100%{ opacity:1; transform:scale(1); }
}

/* ---------- heart phase, centered ---------- */
.frame{
  position:relative;
  width:clamp(230px, 56vw, 380px);
  height:clamp(230px, 56vw, 380px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.frame.dissolve{
  animation:frameDissolve 1.3s ease-in forwards;
}
@keyframes frameDissolve{
  0%{ opacity:1; filter:blur(0px); transform:scale(1); }
  100%{ opacity:0; filter:blur(7px); transform:scale(0.86); }
}
.frame.hidden{
  display:none;
}

.heart-outline{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  overflow:visible;
}
.heart-outline path{
  fill:none;
  stroke:url(#heartGrad);
  stroke-width:1.4;
  stroke-linecap:round;
  transition:stroke-dashoffset 1.9s ease-out;
}

.numbers-layer{
  position:absolute;
  inset:0;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity 0.6s ease;
}
.numbers-layer.show{ opacity:1; }

.eyebrow{
  font-family:'Josefin Sans', Arial, sans-serif;
  font-size:clamp(0.8rem, 2.1vw, 1.15rem);
  letter-spacing:0.4em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:clamp(0.5rem, 1.6vw, 0.9rem);
}

.number{
  font-family:'Cormorant Garamond', Georgia, serif;
  font-weight:600;
  font-size:clamp(3.6rem, 15vw, 7.2rem);
  line-height:0.85;
  color:var(--cream);
  text-shadow:0 6px 34px rgba(85,8,31,0.5);
  animation:heartbeat 2.6s ease-in-out infinite;
}
@keyframes heartbeat{
  0%, 100%{ transform:scale(1); }
  10%{ transform:scale(1.05); }
  20%{ transform:scale(0.99); }
  30%{ transform:scale(1.02); }
  40%{ transform:scale(1); }
}

.label{
  font-family:'Josefin Sans', Arial, sans-serif;
  font-weight:500;
  font-size:clamp(0.68rem, 1.7vw, 0.9rem);
  letter-spacing:0.5em;
  text-transform:uppercase;
  color:var(--light-pink);
  margin-top:clamp(0.35rem, 1.4vw, 0.7rem);
  padding-left:0.5em;
}

/* ---------- caption above the photos ---------- */
.photo-caption{
  display:none;
  font-family:'Cormorant Garamond', Georgia, serif;
  font-style:italic;
  font-weight:600;
  font-size:clamp(0.92rem, 3.5vw, 1.25rem);
  line-height:1.5;
  color:var(--cream);
  text-shadow:0 4px 18px rgba(85,8,31,0.5);
  max-width:82vw;
  text-align:center;
  opacity:0;
  transition:opacity 0.6s ease;
}
.photo-caption.active{ display:block; }
.photo-caption.show{ opacity:1; }

/* ---------- photo phase — same centered spot as the heart ---------- */
.photo-rain{
  display:none;
  position:relative;
  width:clamp(230px, 56vw, 380px);
  height:clamp(230px, 56vw, 380px);
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.photo-rain.active{
  display:flex;
}
.photo-card{
  --dx:0px;
  --rot:0deg;
  position:absolute;
  width:clamp(148px, 40vw, 208px);
  aspect-ratio:4/5;
  background:#fffdfb;
  padding:8px 8px 22px 8px;
  border-radius:7px;
  box-shadow:0 16px 34px rgba(30,4,14,0.45);
  opacity:0;
  transform:translate(var(--dx), -28px) rotate(var(--rot)) scale(0.9);
  transition:opacity 0.65s ease, transform 0.65s cubic-bezier(.2,.8,.25,1);
}
.photo-card.show{
  opacity:1;
  transform:translate(var(--dx), 0) rotate(var(--rot)) scale(1);
}
.photo-card.leave{
  opacity:0;
  transform:translate(var(--dx), 26px) rotate(var(--rot)) scale(0.94);
  transition:opacity 0.6s ease, transform 0.6s ease-in;
}
.photo-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  border-radius:2px;
  background:#eee;
}

/* ---------- truco scene: K de paus mata K de copas ---------- */
.truco-scene{
  display:none;
  position:relative;
  width:clamp(230px, 74vw, 420px);
  height:clamp(230px, 60vw, 340px);
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  opacity:1;
  transition:opacity 0.5s ease;
}
.truco-scene.active{ display:flex; }
.truco-scene.fade-out{ opacity:0; }

.truco-shout{
  position:absolute;
  top:2%;
  left:50%;
  transform:translate(-50%,-50%) scale(0.1) rotate(-8deg);
  font-family:'Josefin Sans', Arial, sans-serif;
  font-weight:700;
  font-size:clamp(2rem, 10vw, 4rem);
  letter-spacing:0.02em;
  color:#fff3d6;
  -webkit-text-stroke:2px #8a0e24;
  text-stroke:2px #8a0e24;
  text-shadow:3px 3px 0 #8a0e24, -2px 2px 0 #8a0e24, 0 0 26px rgba(255,205,110,0.85);
  opacity:0;
  white-space:nowrap;
  z-index:6;
}
.truco-shout.shout{
  animation:shoutIn 0.55s cubic-bezier(.25,1.6,.4,1) forwards;
}
@keyframes shoutIn{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(0.1) rotate(-12deg); }
  55%{ opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(5deg); }
  75%{ transform:translate(-50%,-50%) scale(0.9) rotate(-4deg); }
  100%{ opacity:1; transform:translate(-50%,-50%) scale(1.05) rotate(0deg); }
}

.truco-card{
  position:absolute;
  width:clamp(92px, 26vw, 132px);
  aspect-ratio:0.68;
  background:#fffaf3;
  border-radius:9px;
  box-shadow:0 12px 28px rgba(0,0,0,0.55);
  border:1px solid rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:8px 10px;
  opacity:0;
}
.truco-card .rank{
  font-family:Georgia, 'Times New Roman', serif;
  font-weight:700;
  font-size:clamp(1.1rem, 4vw, 1.55rem);
  line-height:1;
}
.truco-card .suit-mid{
  font-size:clamp(1.7rem, 6.5vw, 2.5rem);
  align-self:center;
}
.truco-card .rank.bottom{
  align-self:flex-end;
  transform:rotate(180deg);
}
.card-hearts .rank, .card-hearts .suit-mid{ color:#d21c3c; }
.card-clubs .rank, .card-clubs .suit-mid{ color:#161616; }

.card-hearts{
  transform:translate(-160%, -70%) rotate(-38deg) scale(0.7);
  z-index:1;
}
.card-hearts.thrown{
  animation:throwHearts 0.85s cubic-bezier(.3,.85,.4,1) forwards;
}
@keyframes throwHearts{
  0%{ opacity:0; transform:translate(-160%, -70%) rotate(-38deg) scale(0.7); }
  70%{ opacity:1; transform:translate(4%, 3%) rotate(9deg) scale(1.06); }
  100%{ opacity:1; transform:translate(-6%, 0%) rotate(-7deg) scale(1); }
}

.card-clubs{
  transform:translate(160%, -85%) rotate(40deg) scale(0.7);
  z-index:2;
}
.card-clubs.thrown{
  animation:throwClubs 0.8s cubic-bezier(.3,.85,.4,1) forwards;
}
@keyframes throwClubs{
  0%{ opacity:0; transform:translate(160%, -85%) rotate(40deg) scale(0.7); }
  65%{ opacity:1; transform:translate(-4%, 2%) rotate(-11deg) scale(1.1); }
  100%{ opacity:1; transform:translate(9%, 4%) rotate(9deg) scale(1); }
}

.impact-burst{
  position:absolute;
  left:50%;
  top:36%;
  font-size:1rem;
  pointer-events:none;
  will-change:transform, opacity;
  z-index:5;
}

/* ---------- final scene: a little decorated letter ---------- */
.final-scene{
  display:none;
  position:relative;
  opacity:0;
  transition:opacity 0.6s ease;
  flex-direction:column;
  align-items:center;
  padding:clamp(0.8rem, 4vw, 1.6rem);
}
.final-scene.active{ display:flex; }
.final-scene.show{ opacity:1; }

.final-glow{
  position:absolute;
  left:50%;
  top:50%;
  width:150%;
  height:170%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(243,207,148,0.30) 0%, rgba(255,95,143,0.16) 45%, transparent 72%);
  filter:blur(18px);
  animation:glowPulse 4.2s ease-in-out infinite;
  z-index:-1;
  pointer-events:none;
}
@keyframes glowPulse{
  0%,100%{ opacity:0.65; transform:translate(-50%,-50%) scale(0.94); }
  50%{ opacity:1; transform:translate(-50%,-50%) scale(1.06); }
}

.final-heart-icon{
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  color:var(--gold);
  margin-bottom:clamp(0.5rem, 2vw, 0.85rem);
  text-shadow:0 2px 12px rgba(85,8,31,0.5);
  animation:heartbeat 2.2s ease-in-out infinite;
}

.letter-card{
  position:relative;
  width:clamp(280px, 88vw, 480px);
  min-height:clamp(260px, 50vh, 640px);
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 31px,
      rgba(120,150,195,0.4) 32px, rgba(120,150,195,0.4) 32px
    ),
    linear-gradient(155deg, #fffdf6 0%, #fff8ec 55%, #fff1de 100%);
  background-position: 0 46px, 0 0;
  border-radius:5px;
  box-shadow:0 22px 48px rgba(20,2,8,0.55), 0 2px 0 rgba(255,255,255,0.5) inset;
  padding:46px 24px 30px 34px;
  transform:rotate(-1.6deg);
}
.letter-card::before{
  content:'';
  position:absolute;
  left:26px;
  top:0;
  bottom:0;
  width:1.5px;
  background:rgba(214,51,90,0.32);
}
.tape{
  position:absolute;
  width:58px;
  height:22px;
  opacity:0.8;
  box-shadow:0 3px 6px rgba(0,0,0,0.2);
}
.tape-left{
  top:-11px;
  left:16px;
  background:rgba(255,196,145,0.88);
  transform:rotate(-9deg);
}
.tape-right{
  top:-9px;
  right:12px;
  background:rgba(255,140,170,0.82);
  transform:rotate(7deg);
}
.card-sticker{
  position:absolute;
  bottom:-12px;
  right:18px;
  font-size:1.5rem;
  color:var(--vivid-red);
  transform:rotate(-12deg);
  text-shadow:0 2px 6px rgba(0,0,0,0.25);
}
.signature{
  margin-top:1.1em;
  text-align:right;
  font-family:'Caveat', 'Segoe Script', cursive;
  font-weight:600;
  font-size:1.15rem;
  color:var(--ink);
  opacity:0;
  transition:opacity 0.6s ease;
}
.signature.show{ opacity:0.9; }

.sparkle{
  position:absolute;
  color:var(--gold);
  font-size:clamp(0.85rem, 2.8vw, 1.2rem);
  opacity:0;
  animation:twinkle 2.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes twinkle{
  0%, 100%{ opacity:0; transform:scale(0.5) rotate(0deg); }
  50%{ opacity:1; transform:scale(1.05) rotate(12deg); }
}
.sp1{ top:-3%;  left:2%;   animation-delay:0s;    color:var(--light-pink); }
.sp2{ top:4%;   right:0%;  animation-delay:0.7s;  }
.sp3{ bottom:4%; left:-3%; animation-delay:1.4s;  }
.sp4{ bottom:-4%; right:4%; animation-delay:2.0s; color:var(--light-pink); }

.love-burst{
  position:absolute;
  left:50%;
  top:50%;
  font-size:1rem;
  pointer-events:none;
  will-change:transform, opacity;
}

.message-outside{
  position:relative;
  font-family:'Caveat', 'Segoe Script', cursive;
  font-weight:600;
  color:var(--ink);
  text-align:left;
  width:100%;
}
.line-p{
  margin:0 0 32px 0;
  font-size:1.32rem;
  line-height:32px;
}
.line-p:last-child{ margin-bottom:0; }

/* ---------- replay control ---------- */
.replay{
  position:absolute;
  bottom:clamp(1.2rem, 3.4vh, 2.2rem);
  left:50%;
  transform:translateX(-50%);
  z-index:3;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.35);
  color:var(--cream);
  font-family:'Josefin Sans', Arial, sans-serif;
  font-size:0.8rem;
  letter-spacing:0.12em;
  text-transform:uppercase;
  padding:0.65em 1.4em;
  border-radius:999px;
  cursor:pointer;
  opacity:0;
  pointer-events:none;
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  transition:opacity 0.6s ease, background 0.2s ease;
}
.replay.show{
  opacity:0.85;
  pointer-events:auto;
}
.replay:hover{
  background:rgba(255,255,255,0.22);
}

@media (prefers-reduced-motion: reduce){
  .stage{ animation:none; }
  .number{ animation:none; }
  .heart-particle{ animation:none; display:none; }
  .final-glow{ animation:none; }
  .sparkle{ animation:none; opacity:0.8; }
}
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <div class="content">
    <h1 class="phrase" id="phrase">
      <span class="phrase-text" id="phraseText"></span><span class="cursor" id="phraseCursor">|</span>
    </h1>

    <div class="milestone" id="milestone">

      <div class="frame" id="frame">
        <svg class="heart-outline" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f3cf94"/>
              <stop offset="55%" stop-color="#ffc2d6"/>
              <stop offset="100%" stop-color="#ff5f8f"/>
            </linearGradient>
          </defs>
          <path id="heartPath" d="M50,88 C22,68 6,50 6,32 C6,17 17,7 31,7 C40,7 47,12 50,20 C53,12 60,7 69,7 C83,7 94,17 94,32 C94,50 78,68 50,88 Z"/>
        </svg>

        <div class="numbers-layer" id="numbersLayer">
          <div class="eyebrow">Felizz...</div>
          <div class="number">8</div>
          <div class="label">meses</div>
        </div>
      </div>

      <div class="photo-caption" id="photoCaption">8 meses, 243 dias, da melhor escolha dos meus dias, da minha vida... Dividir ela contigo...</div>

      <div class="photo-rain" id="photoRain" aria-hidden="true"></div>

      <div class="truco-scene" id="trucoScene">
        <div class="truco-shout" id="trucoShout">É ZAAAPPP!!!</div>
        <div class="truco-card card-hearts" id="cardHearts">
          <span class="rank">K</span>
          <span class="suit-mid">&#9829;</span>
          <span class="rank bottom">K</span>
        </div>
        <div class="truco-card card-clubs" id="cardClubs">
          <span class="rank">K</span>
          <span class="suit-mid">&#9827;</span>
          <span class="rank bottom">K</span>
        </div>
      </div>

      <div class="final-scene" id="finalScene">
        <div class="final-glow" aria-hidden="true"></div>
        <div class="final-heart-icon" aria-hidden="true">&#9829;</div>
        <div class="letter-card">
          <span class="tape tape-left" aria-hidden="true"></span>
          <span class="tape tape-right" aria-hidden="true"></span>
          <div class="message-outside" id="messageOutside">
            <p class="line-p" id="linePara1"></p>
            <p class="line-p" id="linePara2"></p>
            <p class="line-p" id="linePara3"></p>
          </div>
          <span class="cursor" id="loveCursor">|</span>
          <span class="card-sticker" aria-hidden="true">&#9829;</span>
          <div class="signature" id="signature">Com amor, João &#129293;</div>
        </div>
        <span class="sparkle sp1" aria-hidden="true">&#10022;</span>
        <span class="sparkle sp2" aria-hidden="true">&#10023;</span>
        <span class="sparkle sp3" aria-hidden="true">&#10022;</span>
        <span class="sparkle sp4" aria-hidden="true">&#10023;</span>
      </div>

    </div>
  </div>

  <button class="replay" id="replay" type="button">&#8635; ver de novo</button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  try {
    var stage = document.getElementById('stage');
    var phrase = document.getElementById('phrase');
    var phraseText = document.getElementById('phraseText');
    var milestone = document.getElementById('milestone');
    var frame = document.getElementById('frame');
    var numbersLayer = document.getElementById('numbersLayer');
    var photoCaption = document.getElementById('photoCaption');
    var photoRain = document.getElementById('photoRain');
    var trucoScene = document.getElementById('trucoScene');
    var trucoShout = document.getElementById('trucoShout');
    var cardHearts = document.getElementById('cardHearts');
    var cardClubs = document.getElementById('cardClubs');
    var finalScene = document.getElementById('finalScene');
    var messageOutside = document.getElementById('messageOutside');
    var linePara1 = document.getElementById('linePara1');
    var linePara2 = document.getElementById('linePara2');
    var linePara3 = document.getElementById('linePara3');
    var loveCursor = document.getElementById('loveCursor');
    var signature = document.getElementById('signature');
    var replayBtn = document.getElementById('replay');
    var heartsWrap = document.getElementById('hearts');
    var heartPath = document.getElementById('heartPath');

    var PHRASE = 'Feliz nosso Dia...';
    var MESSAGE_PARTS = [
      'Feliz nosso dia meu amor, hoje completamos 8 meses de relacionamento, 8 meses de um ciclo que começou do nada e hoje virou tudo para a minha vida.',
      'Obrigado por tudo meu amor, por ser quem você é, por sempre ser o meu sorriso e ser a minha luz, ser o meu anjinho. eu te amo com cada espaço que tem no meu coração e com cada fragmento que tem na minha alma, que Deus sempre abençõe o nosso relacionamento e que sempre possamos ficar juntos acima de tudo e de qualquer coisa...',
      'Eu te amo tanto, meu floquinho!'
    ];

    var PHOTOS = [
      { src: 'https://i.ibb.co/fVS3SVq0/20251206-201620.jpg', alt: 'lembrança 1' },
      { src: 'https://i.ibb.co/Zpsx8CSq/IMG-20250518-162228-374.webp', alt: 'lembrança 2' },
      { src: 'https://i.ibb.co/CKvtBG85/IMG-20250518-163935-566.webp', alt: 'lembrança 3' },
      { src: 'https://i.ibb.co/8DS5nw2n/IMG-20260329-WA0055.jpg', alt: 'lembrança 4' },
      { src: 'https://i.ibb.co/Q793sRPY/IMG-20260612-WA0009.jpg', alt: 'lembrança 5' },
      { src: 'https://i.ibb.co/xkMLdFb/IMG-20260612-WA0010.jpg', alt: 'lembrança 6' },
      { src: 'https://i.ibb.co/yF8VnSTY/IMG-20260612-WA0012.jpg', alt: 'lembrança 7' }
    ];

    if (!phrase || !phraseText || !milestone || !frame || !numbersLayer || !photoCaption || !photoRain || !trucoScene || !trucoShout || !cardHearts || !cardClubs || !finalScene || !messageOutside || !linePara1 || !linePara2 || !linePara3 || !loveCursor || !signature || !replayBtn || !heartsWrap || !heartPath) {
      throw new Error('elemento essencial nao encontrado');
    }

    // measure the heart path once, so the line-draw effect works
    // reliably across browsers (no dependency on SVG2 pathLength support)
    var heartLen = heartPath.getTotalLength ? heartPath.getTotalLength() : 300;
    heartPath.style.strokeDasharray = heartLen;
    heartPath.style.strokeDashoffset = heartLen;

    var timers = [];
    function clearTimers() { for (var t = 0; t < timers.length; t++) { clearTimeout(timers[t]); } timers = []; }
    function after(ms, fn) { timers.push(setTimeout(fn, ms)); }

    // ambient rain of hearts + flowers, behind everything, runs the whole time
    function spawnHearts() {
      heartsWrap.innerHTML = '';
      var symbols = ['\u2665', '\uD83C\uDF38', '\u2665', '\uD83C\uDF37', '\u2665', '\uD83C\uDF3A'];
      var colors = ['#ffc2d6', '#fff6f8', '#f3cf94', '#ff8fae'];
      var count = 24;
      for (var i = 0; i < count; i++) {
        var h = document.createElement('span');
        h.className = 'heart-particle';
        var sym = symbols[i % symbols.length];
        h.textContent = sym;
        var size = (Math.random() * 1.1 + 0.6).toFixed(2);
        var left = (Math.random() * 100).toFixed(1);
        var duration = (Math.random() * 9 + 9).toFixed(1);
        var delay = (Math.random() * 14).toFixed(1);
        var sway = (Math.random() * 40 + 10).toFixed(0);
        var opacity = (Math.random() * 0.35 + 0.25).toFixed(2);
        h.style.left = left + 'vw';
        h.style.fontSize = size + 'rem';
        if (sym === '\u2665') { h.style.color = colors[i % colors.length]; }
        h.style.animationDuration = duration + 's';
        h.style.animationDelay = delay + 's';
        h.style.setProperty('--sway', sway + 'px');
        h.style.setProperty('--o', opacity);
        heartsWrap.appendChild(h);
      }
    }

    function typeWriter(el, text, speed, onDone) {
      el.textContent = '';
      var i = 0;
      function step() {
        if (i <= text.length) {
          el.textContent = text.slice(0, i);
          i++;
          after(speed, step);
        } else if (onDone) {
          onDone();
        }
      }
      step();
    }

    function drawHeart() {
      heartPath.style.transition = 'stroke-dashoffset 1.9s ease-out';
      heartPath.style.strokeDashoffset = '0';
    }

    function undrawHeart() {
      heartPath.style.transition = 'stroke-dashoffset 1.3s ease-in';
      heartPath.style.strokeDashoffset = String(heartLen);
    }

    // ---------- photo rain: memories dropping in, one by one, in the heart's place ----------
    var photoCards = [];
    function spawnPhotoCards() {
      photoRain.innerHTML = '';
      photoCards = [];
      for (var i = 0; i < PHOTOS.length; i++) {
        var card = document.createElement('div');
        card.className = 'photo-card';
        var dx = (Math.random() * 26 - 13).toFixed(0);
        var rot = (Math.random() * 12 - 6).toFixed(1);
        card.style.setProperty('--dx', dx + 'px');
        card.style.setProperty('--rot', rot + 'deg');
        var img = document.createElement('img');
        img.src = PHOTOS[i].src;
        img.alt = PHOTOS[i].alt;
        img.loading = 'eager';
        img.decoding = 'async';
        card.appendChild(img);
        photoRain.appendChild(card);
        photoCards.push(card);
      }
    }

    function runPhotoRain(onAllDone) {
      var HOLD = 1300;
      var GAP = 250;
      function showPhoto(i) {
        if (i >= photoCards.length) { onAllDone(); return; }
        var card = photoCards[i];
        card.classList.add('show');
        after(HOLD, function () {
          card.classList.remove('show');
          card.classList.add('leave');
          after(600, function () {
            after(GAP, function () { showPhoto(i + 1); });
          });
        });
      }
      showPhoto(0);
    }

    // ---------- generic little burst of symbols ----------
    function burstSymbols(container, symbols, count, colors, className, spread) {
      for (var i = 0; i < count; i++) {
        (function (idx) {
          var s = document.createElement('span');
          s.className = className;
          s.textContent = symbols[idx % symbols.length];
          var angle = Math.random() * Math.PI * 2;
          var dist = spread.min + Math.random() * (spread.max - spread.min);
          var dx = Math.cos(angle) * dist;
          var dy = Math.sin(angle) * dist;
          var size = (0.7 + Math.random() * 0.9).toFixed(2);
          s.style.fontSize = size + 'rem';
          s.style.color = colors[idx % colors.length];
          container.appendChild(s);
          if (s.animate) {
            var anim = s.animate([
              { transform: 'translate(-50%,-50%) scale(0.4)', opacity: 1 },
              { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(1)', opacity: 0 }
            ], { duration: 1200 + Math.random() * 500, delay: Math.random() * 150, easing: 'ease-out', fill: 'forwards' });
            anim.onfinish = function () { s.remove(); };
          } else {
            after(1700, function () { s.remove(); });
          }
        })(i);
      }
    }

    function runSequence() {
      clearTimers();
      spawnHearts();
      spawnPhotoCards();

      phrase.classList.remove('enter', 'leave', 'typing');
      milestone.classList.remove('enter');
      frame.classList.remove('dissolve', 'hidden');
      numbersLayer.classList.remove('show');
      photoCaption.classList.remove('active', 'show');
      photoRain.classList.remove('active');
      trucoScene.classList.remove('active', 'fade-out');
      trucoShout.classList.remove('shout');
      cardHearts.classList.remove('thrown');
      cardClubs.classList.remove('thrown');
      finalScene.classList.remove('active', 'show');
      signature.classList.remove('show');
      replayBtn.classList.remove('show');
      phraseText.textContent = '';
      linePara1.textContent = '';
      linePara2.textContent = '';
      linePara3.textContent = '';
      messageOutside.classList.remove('typing');
      heartPath.style.transition = 'none';
      heartPath.style.strokeDashoffset = String(heartLen);
      void phrase.offsetWidth;

      // 1. phrase fades in, types itself out fairly quickly
      phrase.classList.add('enter');
      phrase.classList.add('typing');

      after(300, function () {
        typeWriter(phraseText, PHRASE, 65, function () {
          after(1400, function () {
            phrase.classList.remove('typing');
            phrase.classList.remove('enter');
            phrase.classList.add('leave');

            after(280, function () {
              // 2. heart forms, centered, and holds "juntos há 8 meses" alone for a while
              milestone.classList.add('enter');
              after(150, drawHeart);
              after(400, function () { numbersLayer.classList.add('show'); });

              after(3800, function () {
                // 3. the heart dissolves completely before the photos appear
                frame.classList.add('dissolve');
                numbersLayer.classList.remove('show');
                undrawHeart();

                after(1300, function () {
                  frame.classList.add('hidden');

                  // 4. caption + photos, one by one, in the heart's place
                  photoCaption.classList.add('active');
                  after(60, function () { photoCaption.classList.add('show'); });
                  photoRain.classList.add('active');

                  runPhotoRain(function () {
                    photoRain.classList.remove('active');
                    photoCaption.classList.remove('show');

                    after(600, function () {
                      photoCaption.classList.remove('active');

                      // 5. truco scene: K de paus mata o K de copas
                      trucoScene.classList.add('active');
                      after(350, function () { cardHearts.classList.add('thrown'); });
                      after(1050, function () {
                        cardClubs.classList.add('thrown');
                        stage.classList.add('shake');
                        after(450, function () { stage.classList.remove('shake'); });
                        after(150, function () {
                          trucoShout.classList.add('shout');
                          burstSymbols(trucoScene, ['\u2726', '\u2605'], 10, ['#f3cf94', '#fff3d6', '#ffdca1'], 'impact-burst', { min: 50, max: 120 });
                        });
                      });

                      after(3300, function () {
                        trucoScene.classList.add('fade-out');
                        after(500, function () {
                          trucoScene.classList.remove('active', 'fade-out');

                          // 6. the final letter, decorated, writing itself
                          finalScene.classList.add('active');
                          after(30, function () { finalScene.classList.add('show'); });
                          burstSymbols(finalScene, ['\u2665'], 12, ['#ffc2d6', '#fff6f8', '#f3cf94'], 'love-burst', { min: 60, max: 150 });

                          var letterParagraphs = [linePara1, linePara2, linePara3];
                          messageOutside.classList.add('typing');
                          var pIdx = 0;
                          function typeNextParagraph() {
                            if (pIdx >= letterParagraphs.length) {
                              messageOutside.classList.remove('typing');
                              signature.classList.add('show');
                              after(700, function () { replayBtn.classList.add('show'); });
                              return;
                            }
                            var target = letterParagraphs[pIdx];
                            var textSpan = document.createElement('span');
                            textSpan.className = 'p-text';
                            target.appendChild(textSpan);
                            target.appendChild(loveCursor);
                            typeWriter(textSpan, MESSAGE_PARTS[pIdx], 26, function () {
                              pIdx++;
                              after(350, typeNextParagraph);
                            });
                          }
                          typeNextParagraph();
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    }

    replayBtn.addEventListener('click', runSequence);
    runSequence();

  } catch (err) {
    // fallback: if anything goes wrong, always show the content statically
    // instead of leaving a blank screen
    console.error('Falha na animacao, mostrando versao estatica:', err);
    var p = document.getElementById('phraseText');
    var ph = document.getElementById('phrase');
    var ms = document.getElementById('milestone');
    var nl = document.getElementById('numbersLayer');
    var fs = document.getElementById('finalScene');
    var lp1 = document.getElementById('linePara1');
    var lp2 = document.getElementById('linePara2');
    var lp3 = document.getElementById('linePara3');
    if (p) p.textContent = 'Feliz nosso dia';
    if (ph) { ph.style.opacity = '1'; ph.style.position = 'static'; ph.style.transform = 'none'; }
    if (ms) { ms.style.opacity = '1'; ms.style.transform = 'none'; }
    if (nl) nl.style.opacity = '1';
    if (fs) { fs.style.display = 'flex'; fs.style.opacity = '1'; }
    if (lp1) lp1.textContent = 'Feliz nosso dia meu amor, hoje completamos 8 meses de relacionamento, 8 meses de um ciclo que começou do nada e hoje virou tudo para a minha vida.';
    if (lp2) lp2.textContent = 'Obrigado por tudo meu amor, por ser quem você é, por sempre ser o meu sorriso e ser a minha luz, ser o meu anjinho. eu te amo com cada espaço que tem no meu coração e com cada fragmento que tem na minha alma, que Deus sempre abençõe o nosso relacionamento e que sempre possamos ficar juntos acima de tudo e de qualquer coisa...';
    if (lp3) lp3.textContent = 'Eu te amo tanto, meu floquinho!';
  }
});
</script>
